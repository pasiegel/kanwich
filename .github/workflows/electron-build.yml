name: Build Electron apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: kanwich-windows
            artifact_glob: release/*.exe
          - os: macos-latest
            artifact_name: kanwich-mac
            artifact_glob: release/*.dmg
          - os: ubuntu-latest
            artifact_name: kanwich-linux
            artifact_glob: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}

    # Needed only so the tag-triggered run can attach installers to a
    # GitHub Release; harmless (and unused) on a manual workflow_dispatch run.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
      - run: npm run electron:build:main

      # Tagging a release (v1.0.0 etc.) publishes installers to a GitHub
      # Release; a manual run just builds them as downloadable artifacts.
      - name: Package (and publish on a version tag)
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
